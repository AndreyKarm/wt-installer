name: Build and Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  build:
    name: Build Windows Executable
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # A tag newer than app.Version would make every client "update" to
      # the same build on each start, forever.
      - name: Check tag matches app.Version
        shell: pwsh
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          $tag = $env:TAG.TrimStart('v')
          $m = Select-String -Path internal/app/app.go -Pattern 'Version\s*=\s*"([^"]+)"'
          if (-not $m) { Write-Error "Version not found in internal/app/app.go"; exit 1 }
          $version = $m.Matches[0].Groups[1].Value
          if ($tag -ne $version) {
            Write-Error "Release tag '$env:TAG' does not match app.Version '$version'"
            exit 1
          }
          Write-Host "Tag $env:TAG matches app.Version $version"

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Install rsrc
        run: go install github.com/akavel/rsrc@latest

      - name: Generate icon resource
        run: rsrc -ico media/icon.ico -o cmd/wt-installer/rsrc.syso

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: >
          go build
          -ldflags="-s -w -H=windowsgui"
          -o "WT Installer.exe" ./cmd/wt-installer

      - name: Install UPX
        run: choco install upx -y

      - name: Compress executable
        run: upx --best --lzma "WT Installer.exe"

      - name: Upload Release Asset
        uses: softprops/action-gh-release@v2
        with:
          files: "WT Installer.exe"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
